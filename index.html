<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards de idiomas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0ea; --ink:#1f2a2e; --muted:#6a7478; --card:#ffffff; --line:#d9d4c9;
  --accent:#2f5d62; --accent-ink:#ffffff; --ok:#2e7d4f; --ok-bg:#e1f2e8; --bad:#b3392f; --bad-bg:#f8e3e0;
  --ja:#c4453a; --pt:#2f7a52;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15191b; --ink:#e9e6df; --muted:#8e989c; --card:#1f2527; --line:#34403f;
    --accent:#7fb6b0; --accent-ink:#10201f; --ok:#6fcf97; --ok-bg:#1d3326; --bad:#ef8a80; --bad-bg:#3a1f1c;
    --ja:#e5766b; --pt:#6fc59a;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;min-height:100vh;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0}
h1{font-size:2.1rem} h2{font-size:1.5rem}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:26px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
.back:hover{border-color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{aspect-ratio:1/1;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);font:inherit;padding:14px;text-align:center}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile{transition:transform .15s,border-color .15s}
.tile .big{font-size:3rem;line-height:1}
.tile .name{font-weight:700;font-size:1.15rem}
.tile .meta{font-size:.85rem;color:var(--muted)}
.tile.ja{border-color:var(--ja)} .tile.pt{border-color:var(--pt)}
.tile.dashed{border-style:dashed;cursor:default;opacity:.7}
.tile.dashed:hover{transform:none;border-color:var(--line)}
.tag{font-weight:700;color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}

/* quiz */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{color:var(--muted);font-size:.9rem;margin-bottom:18px;display:flex;justify-content:space-between}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 20px;text-align:center;margin-bottom:18px}
.word{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700;cursor:pointer;display:inline-block;padding:4px 14px;border-radius:12px;word-break:keep-all}
.word:hover{background:var(--bg)}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.reveal{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.reveal .romaji{font-size:1.2rem;color:var(--accent);font-weight:700}
.reveal .es{font-size:1.4rem;margin-top:2px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.05rem;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:8px}
.status{margin-top:14px;font-weight:700;min-height:1.4em}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.result{text-align:center;padding:30px 10px}
.result .score{font-family:Fraunces,serif;font-size:3.4rem;font-weight:700}

/* login y usuario */
.authbox{display:flex;flex-direction:column;gap:12px;max-width:380px}
.inp{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:1rem}
.inp:focus{border-color:var(--accent);outline:none}
.authbox .btn,.authbox .btn.ghost{margin:0;width:100%}
.userbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px;color:var(--muted);font-size:.9rem}
.userbar .back{margin-left:auto}
.syncdot{font-size:.85rem}
/* srs */
.tile{position:relative}
.badge{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.srsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.btn.small{margin:0;padding:8px 16px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:Fraunces,serif;font-size:1.6rem}
.stat span{color:var(--muted);font-size:.85rem}
.srsmsg{color:var(--muted);font-weight:400;font-size:.9rem}
.btn.danger{margin-left:0;color:var(--bad);border-color:var(--bad)}

/* summary */
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.line:hover{border-color:var(--accent)}
.line .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.line .jp{font-size:1.25rem;margin-top:2px}
.line .tr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--accent);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   DATOS  —  aquí agregas contenido nuevo
   Estructura: idioma → contenedores (J1, J2...) → videos (J1.1, J1.2...)
   Cada video tiene: lines (subtítulos con traducción) y words (vocabulario).
   Los mazos se arman solos de 10 en 10 con el orden de "words".
   ===================================================================== */
const DATA = {
  ja: {
    name: "Japonés", native: "日本語", cls: "ja",
    containers: [
      {
        id: "J1", title: "Siesta",
        videos: [
          {
            id: "J1.1", title: "Video 1",
            lines: [
              { t: "00:00.000 --> 00:10.000",
                jp: "分かってるよ。君は私のことを特別に思っていなかったし、 私も君を特別扱いはしなかった。",
                es: "Lo sé. Tú no me considerabas alguien especial, y yo tampoco te di un trato especial." },
              { t: "00:10.000 --> 00:26.000",
                jp: "ただ、君と過ごしたあの目も眩むような3年間は、 私にとって何よりの思い出だよ。",
                es: "Pero esos tres años deslumbrantes que pasé contigo son, para mí, el mejor de los recuerdos." },
              { t: "00:26.000 --> 00:30.000",
                jp: "馬鹿か、君は。",
                es: "¿Eres tonto o qué?" },
              { t: "00:32.000 --> 00:39.000",
                jp: "死人に意地を張ってどうするの? この1年、一人でよく頑張った。",
                es: "¿De qué sirve obstinarte con una persona muerta? Este último año te esforzaste mucho tú solo." }
            ],
            words: [
              { w: "分かる",   r: "wakaru",          es: "entender; saber" },
              { w: "君",       r: "kimi",            es: "tú (informal)" },
              { w: "私",       r: "watashi",         es: "yo" },
              { w: "特別",     r: "tokubetsu",       es: "especial" },
              { w: "思う",     r: "omou",            es: "pensar; considerar" },
              { w: "特別扱い", r: "tokubetsu atsukai", es: "trato especial" },
              { w: "ただ",     r: "tada",            es: "solo; pero" },
              { w: "過ごす",   r: "sugosu",          es: "pasar (tiempo)" },
              { w: "あの",     r: "ano",             es: "aquel / aquella" },
              { w: "目",       r: "me",              es: "ojo" },
              { w: "眩む",     r: "kuramu",          es: "deslumbrar; marearse" },
              { w: "3年間",    r: "san nenkan",      es: "tres años (duración)" },
              { w: "何より",   r: "nani yori",       es: "más que nada" },
              { w: "思い出",   r: "omoide",          es: "recuerdo" },
              { w: "馬鹿",     r: "baka",            es: "tonto" },
              { w: "死人",     r: "shinin",          es: "persona muerta" },
              { w: "意地を張る", r: "iji o haru",    es: "ser terco; empecinarse" },
              { w: "どうする", r: "dou suru",        es: "¿qué hacer?" },
              { w: "1年",      r: "ichi nen",        es: "un año" },
              { w: "一人",     r: "hitori",          es: "una persona; solo" },
              { w: "よく",     r: "yoku",            es: "bien; mucho" },
              { w: "頑張る",   r: "ganbaru",         es: "esforzarse; dar lo mejor" }
            ]
          },
          { id: "J1.2", title: "Video 2", lines: [], words: [] }
        ]
      }
    ]
  },
  pt: {
    name: "Portugués", native: "Português", cls: "pt",
    containers: []
  }
};

/* =====================================================================
   SRS  —  repetición espaciada (estilo SM-2 simplificado)
   Cada palabra guarda: ease (facilidad), interval (días), reps, lapses, due.
   · Acierto a la primera:  1 día → 3 días → intervalo × ease
   · Fallo (o ver la respuesta): vuelve en 10 min, baja la facilidad
   El progreso se guarda en Supabase (tabla siesta_srs_cards) por usuario; localStorage solo es caché.
   ===================================================================== */
const DECK_SIZE = 10, SESSION_MAX = 20;
const KEY_OLD = "flashcards_srs_v1";          // progreso local de la versión anterior (se migra)
const DAY = 864e5, MIN = 6e4;

/* --- Supabase (proyecto mis-cursos, tabla siesta_srs_cards) --- */
const SUPABASE_URL = "https://ebtehnbffwobpdnmftod.supabase.co";
const SUPABASE_KEY = "sb_publishable_N60b6zwvsPG66AY3cv46Ag_GRPl-LUD";   // clave pública: la seguridad la da RLS
const TABLE = "siesta_srs_cards";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let USER = null;        // usuario con sesión
let SRS = {};           // progreso en memoria: { cardId: {ease, interval, reps, lapses, due} }
let dirty = {};         // cambios pendientes de subir: { cardId: versión }
let ver = 0, syncState = "ok", flushTimer = null, NOTICE = "";

const toRow = (id, c) => ({ user_id: USER.id, card_id: id, ease: c.ease, interval_days: c.interval,
  reps: c.reps, lapses: c.lapses, due: new Date(c.due).toISOString(), updated_at: new Date().toISOString() });
const fromRow = r => ({ ease: r.ease, interval: r.interval_days, reps: r.reps, lapses: r.lapses, due: Date.parse(r.due) });

function cacheKey(){ return "siesta_cache_" + USER.id; }
function saveSRS(){ try { localStorage.setItem(cacheKey(), JSON.stringify({ srs:SRS, dirty })); } catch(e){} }
function syncText(){ return syncState === "ok" ? "✓ Sincronizado" : syncState === "pending" ? "Sincronizando…" : "⚠ Sin conexión: se subirá luego"; }
function updateSync(){ document.querySelectorAll(".syncdot").forEach(el => el.textContent = syncText()); }
function markDirty(id){ dirty[id] = ++ver; syncState = "pending"; saveSRS(); updateSync(); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400); }

async function flush(){
  if (!USER) return;
  const snap = { ...dirty }, ids = Object.keys(snap);
  if (!ids.length){ syncState = "ok"; updateSync(); return; }
  try {
    const { error } = await sb.from(TABLE).upsert(ids.map(id => toRow(id, SRS[id])), { onConflict: "user_id,card_id" });
    if (error) throw error;
    ids.forEach(id => { if (dirty[id] === snap[id]) delete dirty[id]; });
    syncState = Object.keys(dirty).length ? "pending" : "ok";
  } catch(e){ syncState = "error"; }
  saveSRS(); updateSync();
}
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

async function loadRemote(){
  const all = {}; let from = 0; const step = 1000;
  for (;;){
    const { data, error } = await sb.from(TABLE).select("card_id,ease,interval_days,reps,lapses,due").order("card_id").range(from, from+step-1);
    if (error) throw error;
    data.forEach(r => all[r.card_id] = fromRow(r));
    if (data.length < step) break;
    from += step;
  }
  return all;
}
const now = () => Date.now();

function grade(id, ok){
  const t = now();
  const c = SRS[id] || { ease:2.5, interval:0, reps:0, lapses:0, due:t };
  if (ok){
    c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.max(c.interval+1, Math.round(c.interval*c.ease));
    c.reps++;
    c.ease = Math.min(3, c.ease + 0.05);
    c.due = t + c.interval*DAY;
  } else {
    c.reps = 0; c.interval = 0; c.lapses++;
    c.ease = Math.max(1.3, c.ease - 0.2);
    c.due = t + 10*MIN;
  }
  SRS[id] = c;
  markDirty(id);
}
function fmtIn(ms){
  if (ms <= 0) return "ahora";
  if (ms < 60*MIN) return Math.max(1, Math.round(ms/MIN)) + " min";
  if (ms < 22*60*MIN) return Math.round(ms/(60*MIN)) + " h";
  const d = Math.round(ms/DAY);
  return d === 1 ? "1 día" : d + " días";
}

/* ---------- Tarjetas ---------- */
function mk(lang, V, w){ return { id: lang+"|"+V.id+"|"+w.w, lang, vid: V.id, w:w.w, r:w.r, es:w.es }; }
function allCards(langKey){
  const out = [];
  for (const [lk, L] of Object.entries(DATA)){
    if (langKey && lk !== langKey) continue;
    L.containers.forEach(C => C.videos.forEach(V => V.words.forEach(w => out.push(mk(lk, V, w)))));
  }
  return out;
}
function isDue(c){ const s = SRS[c.id]; return !!s && s.due <= now(); }
function dueCards(list){ return list.filter(isDue).sort((a,b) => SRS[a.id].due - SRS[b.id].due); }
function stats(langKey){
  const t = now(); let studied=0, due=0, mature=0, next=Infinity;
  const cards = allCards(langKey);
  cards.forEach(c => {
    const s = SRS[c.id]; if (!s) return;
    studied++;
    if (s.due <= t) due++; else next = Math.min(next, s.due);
    if (s.interval >= 21) mature++;
  });
  return { total:cards.length, studied, due, mature, next };
}

/* =====================================================================
   APP
   ===================================================================== */
const app = document.getElementById("app");
let timer = null;
let S = { view: "hub" };

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat(Infinity).forEach(c => { if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function put(...kids){ kids.flat(Infinity).forEach(c => { if (c != null && c !== false) app.append(c); }); }
function go(next){ clearTimeout(timer); S = next; render(); window.scrollTo(0,0); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function chunk(a,n){ const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }

function crumbs(parts, backTo){
  const bar = h("div", {class:"crumbs"});
  if (backTo) bar.append(h("button", {class:"back", onclick:()=>go(backTo)}, "← Volver"));
  bar.append(h("span", {}, parts.join(" / ")));
  return bar;
}
function render(){
  app.innerHTML = "";
  ({ loading, login, hub, langs, lang, container, video, quiz, deckEnd, summary, srsHome, reviewEnd })[S.view]();
}

/* ---------- Carga y login ---------- */
function loading(){ put(h("p", {class:"sub"}, "Cargando…")); }

const AUTH_ERR = {
  "Invalid login credentials": "Correo o contraseña incorrectos.",
  "User already registered": "Ese correo ya tiene cuenta. Entra con tu contraseña.",
  "Email not confirmed": "Confirma tu correo antes de entrar (revisa tu bandeja).",
  "Password should be at least 6 characters.": "La contraseña debe tener al menos 6 caracteres."
};
function login(){
  let mode = "in";
  const msg = h("div", {class:"status", role:"status"});
  const email = h("input", {class:"inp", type:"email", placeholder:"Correo", autocomplete:"email", required:true});
  const pass = h("input", {class:"inp", type:"password", placeholder:"Contraseña (mín. 6 caracteres)", autocomplete:"current-password", required:true});
  const btn = h("button", {class:"btn", type:"submit"}, "Entrar");
  const toggle = h("button", {class:"btn ghost", type:"button"}, "Crear cuenta nueva");
  const title = h("h2", {}, "Entrar");
  function show(t, cls){ msg.textContent = t; msg.className = "status " + (cls||""); }
  function setMode(m){
    mode = m;
    title.textContent = m === "in" ? "Entrar" : "Crear cuenta";
    btn.textContent = m === "in" ? "Entrar" : "Crear cuenta";
    toggle.textContent = m === "in" ? "Crear cuenta nueva" : "Ya tengo cuenta";
    pass.setAttribute("autocomplete", m === "in" ? "current-password" : "new-password");
  }
  toggle.addEventListener("click", () => { setMode(mode === "in" ? "up" : "in"); show(""); });
  const form = h("form", {class:"authbox", onsubmit: async e => {
    e.preventDefault();
    const em = email.value.trim(), pw = pass.value;
    if (!em || pw.length < 6){ show("Escribe tu correo y una contraseña de al menos 6 caracteres.", "bad"); return; }
    btn.disabled = true; show("Un momento…");
    let res;
    try {
      res = mode === "in" ? await sb.auth.signInWithPassword({ email:em, password:pw })
                          : await sb.auth.signUp({ email:em, password:pw });
    } catch(err){ res = { error:{ message:"No hay conexión. Intenta de nuevo." } }; }
    btn.disabled = false;
    if (res.error){ show(AUTH_ERR[res.error.message] || res.error.message, "bad"); return; }
    if (!res.data.session){ show("Cuenta creada. Revisa tu correo para confirmarla y luego entra.", "ok"); setMode("in"); return; }
    USER = res.data.session.user;
    enter();
  }}, title, email, pass, btn, toggle, msg);
  put(
    h("h1", {}, "Siesta · Flashcards"),
    h("p", {class:"sub"}, "Entra para guardar tu progreso y verlo en cualquier dispositivo."),
    form
  );
}

/* Tras iniciar sesión: baja el progreso, migra el local y entra al hub */
async function enter(){
  go({view:"loading"});
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(cacheKey())) || {}; } catch(e){}
  try {
    SRS = await loadRemote(); syncState = "ok";
    dirty = cache.dirty || {};
    Object.keys(dirty).forEach(id => { if (cache.srs && cache.srs[id]) SRS[id] = cache.srs[id]; else delete dirty[id]; });
  } catch(e){
    SRS = cache.srs || {}; dirty = cache.dirty || {}; syncState = "error";
  }
  // migrar progreso de la versión sin cuenta
  try {
    const old = JSON.parse(localStorage.getItem(KEY_OLD));
    if (old && typeof old === "object"){
      let n = 0;
      for (const id in old){ if (!SRS[id]){ SRS[id] = old[id]; dirty[id] = ++ver; n++; } }
      localStorage.removeItem(KEY_OLD);
      if (n) NOTICE = "Se subieron "+n+" palabras de tu progreso anterior a tu cuenta.";
    }
  } catch(e){}
  saveSRS();
  if (Object.keys(dirty).length){ syncState = "pending"; flush(); }
  go({view:"hub"});
}
async function logout(){
  await flush();
  await sb.auth.signOut();          // dispara SIGNED_OUT → pantalla de login
}

/* ---------- Hub ---------- */
function hub(){
  const st = stats();
  put(
    h("div", {class:"userbar"},
      h("span", {}, USER ? USER.email : ""),
      h("span", {class:"syncdot"}, syncText()),
      h("button", {class:"back", onclick:logout}, "Cerrar sesión")),
    NOTICE ? h("div", {class:"srsbar"}, NOTICE) : null,
    h("h1", {}, "Hub de estudio"),
    h("p", {class:"sub"}, "Elige una sección."),
    h("div", {class:"grid"},
      h("button", {class:"tile", onclick:()=>go({view:"langs"})},
        h("div", {class:"big"}, "🗂️"), h("div", {class:"name"}, "Flashcards idiomas")),
      h("button", {class:"tile", onclick:()=>go({view:"srsHome"})},
        h("div", {class:"big"}, "🔁"), h("div", {class:"name"}, "Repaso SRS"),
        h("div", {class:"meta"}, st.due ? st.due+" pendiente(s)" : "Al día"),
        st.due ? h("span", {class:"badge"}, st.due) : null)
    )
  );
  NOTICE = "";
}

/* ---------- Idiomas ---------- */
function langs(){
  put(
    crumbs(["Hub","Flashcards idiomas"], {view:"hub"}),
    h("h2", {}, "Flashcards idiomas"),
    h("p", {class:"sub"}, "¿Qué idioma estudiamos?"),
    h("div", {class:"grid"},
      Object.entries(DATA).map(([key,l]) =>
        h("button", {class:"tile "+l.cls, onclick:()=>go({view:"lang", lang:key})},
          h("div", {class:"big"}, l.native.slice(0,2)),
          h("div", {class:"name"}, l.name),
          h("div", {class:"meta"}, l.containers.length ? l.containers.length+" contenedor(es)" : "Próximamente")))
    )
  );
}

/* ---------- Contenedores ---------- */
function lang(){
  const L = DATA[S.lang];
  put(
    crumbs(["Hub","Idiomas",L.name], {view:"langs"}),
    h("h2", {}, L.name),
    h("p", {class:"sub"}, "Elige un contenedor."),
    L.containers.length
      ? h("div", {class:"grid"}, L.containers.map((c,i) =>
          h("button", {class:"tile "+L.cls, onclick:()=>go({view:"container", lang:S.lang, ci:i})},
            h("div", {class:"tag"}, c.id),
            h("div", {class:"name"}, c.title),
            h("div", {class:"meta"}, c.videos.length+" video(s)"))))
      : h("div", {class:"empty"}, "Aún no hay contenido para "+L.name+". Agrégalo en DATA dentro del HTML.")
  );
}

/* ---------- Videos ---------- */
function container(){
  const L = DATA[S.lang], C = L.containers[S.ci];
  put(
    crumbs(["Hub",L.name,C.id+" "+C.title], {view:"lang", lang:S.lang}),
    h("h2", {}, C.id+" · "+C.title),
    h("p", {class:"sub"}, "Elige un video."),
    h("div", {class:"grid"}, C.videos.map((v,i) => {
      const decks = Math.ceil(v.words.length/DECK_SIZE);
      const due = dueCards(v.words.map(w => mk(S.lang, v, w))).length;
      return h("button", {class:"tile "+L.cls, onclick:()=>go({view:"video", lang:S.lang, ci:S.ci, vi:i})},
        h("div", {class:"tag"}, v.id),
        h("div", {class:"name"}, v.title),
        h("div", {class:"meta"}, v.words.length ? v.words.length+" palabras · "+decks+" mazo(s)" : "Sin vocabulario aún"),
        due ? h("span", {class:"badge"}, due) : null);
    }))
  );
}

/* ---------- Mazos ---------- */
function vref(){ const L = DATA[S.lang], C = L.containers[S.ci], V = C.videos[S.vi]; return {L,C,V}; }
function video(){
  const { L, V } = vref();
  const cards = V.words.map(w => mk(S.lang, V, w));
  const decks = chunk(cards, DECK_SIZE);
  const due = dueCards(cards);
  const studied = cards.filter(c => SRS[c.id]).length;
  const back = {view:"video", lang:S.lang, ci:S.ci, vi:S.vi};
  put(
    crumbs(["Hub",L.name,V.id], {view:"container", lang:S.lang, ci:S.ci}),
    h("h2", {}, V.id+" · "+V.title),
    h("p", {class:"sub"}, "Mazos de "+DECK_SIZE+" palabras. Estudiadas: "+studied+" de "+cards.length+"."),
    due.length
      ? h("div", {class:"srsbar"},
          h("span", {}, h("b", {}, due.length), " palabra(s) para repasar de este video"),
          h("button", {class:"btn small", onclick:()=>startReview(due.slice(0,SESSION_MAX), S.lang, back)}, "Repasar"))
      : null,
    decks.length
      ? h("div", {class:"grid"}, decks.map((d,i) => {
          const n = d.filter(c => SRS[c.id]).length;
          return h("button", {class:"tile "+L.cls, onclick:()=>startDeck(i)},
            h("div", {class:"tag"}, "Mazo "+(i+1)),
            h("div", {class:"name"}, d[0].w+" …"),
            h("div", {class:"meta"}, d.length+" palabras"+(n ? " · "+n+" vistas" : "")));
        }))
      : h("div", {class:"empty"}, "Este video todavía no tiene vocabulario.")
  );
}

/* ---------- Sesiones ---------- */
function newSess(mode, cards, pool, back){
  return { mode, queue: cards.slice(), total: cards.length, done: 0, score: 0,
           seen: {}, pool, back, answered:false, picked:null, peeked:false, res:null, msg:"", options:null };
}
function startDeck(di){
  const { V } = vref();
  const cards = V.words.map(w => mk(S.lang, V, w));
  const deck = chunk(cards, DECK_SIZE)[di];
  S = { ...S, view:"quiz", di,
        sess: newSess("deck", deck, cards, {view:"video", lang:S.lang, ci:S.ci, vi:S.vi}) };
  render(); window.scrollTo(0,0);
}
function startReview(cards, langKey, back){
  S = { view:"quiz", lang:langKey, sess: newSess("review", cards, allCards(langKey), back) };
  render(); window.scrollTo(0,0);
}

/* Aplica el resultado al SRS */
function srsApply(card, ok, mode){
  if (mode === "review") grade(card.id, ok);
  else {                                  // en mazos: solo si es nueva, está vencida o fallaste
    const s = SRS[card.id];
    if (!s || s.due <= now() || !ok) grade(card.id, ok);
  }
}

/* ---------- Quiz (mazos y repaso) ---------- */
function quiz(){
  const se = S.sess, card = se.queue[0];
  if (!se.options){
    const wrong = shuffle(se.pool.filter(x => x.es !== card.es))
      .filter((x,i,a) => a.findIndex(y => y.es === x.es) === i).slice(0,3).map(x => x.es);
    se.options = shuffle([card.es, ...wrong]);
  }
  const revealed = se.answered || se.peeked;
  const label = se.mode === "review" ? "Repaso" : "Mazo "+(S.di+1);

  function fail(){
    if (!se.seen[card.id]){ srsApply(card, false, se.mode); se.seen[card.id] = true;
      se.msg = "Volverá a aparecer en 10 min."; }
    else se.msg = "";
    se.res = "bad";
  }
  function peek(){ if (revealed) return; se.peeked = true; fail(); render(); }
  function choose(o){
    if (revealed) return;
    se.answered = true; se.picked = o;
    if (o === card.es){
      se.res = "ok"; se.msg = "";
      if (!se.seen[card.id]){
        se.seen[card.id] = true; se.score++;
        const prevDue = SRS[card.id] ? SRS[card.id].due : null;
        srsApply(card, true, se.mode);
        const s = SRS[card.id];
        if (s && s.due !== prevDue) se.msg = "Próximo repaso en " + fmtIn(s.due - now()) + "." ;
      }
      render();
      timer = setTimeout(next, 1100);       // acierto → avanza solo
    } else { fail(); render(); }            // fallo → avance manual
  }
  function next(){
    clearTimeout(timer);
    const c = se.queue.shift();
    if (se.mode === "review" && se.res === "bad") se.queue.push(c);   // en repaso, la fallada se repite
    else se.done++;
    se.answered = false; se.picked = null; se.peeked = false; se.res = null; se.msg = ""; se.options = null;
    if (!se.queue.length) S = { ...S, view: se.mode === "deck" ? "deckEnd" : "reviewEnd" };
    render();
  }

  const wordEl = h("span", {class:"word", role:"button", tabindex:"0", lang:"ja",
    onclick: peek, onkeydown: e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); peek(); } }}, card.w);

  const reveal = revealed
    ? h("div", {class:"reveal"}, h("div", {class:"romaji"}, card.r), h("div", {class:"es"}, card.es))
    : h("div", {class:"hint"}, "Toca la palabra para ver su traducción");

  const opts = h("div", {class:"opts"}, se.options.map(o => {
    let cls = "opt";
    if (revealed){ if (o === card.es) cls += " ok"; else if (o === se.picked) cls += " bad"; }
    return h("button", {class:cls, disabled: revealed, onclick:()=>choose(o)}, o);
  }));

  put(
    crumbs([label, card.vid], se.back),
    h("div", {class:"progress"}, h("i", {style:"width:"+(se.done/se.total*100)+"%"})),
    h("div", {class:"count"}, h("span", {}, (se.done+1 > se.total ? se.total : se.done+1)+" de "+se.total+(se.queue.length>se.total-se.done?"":"")),
                               h("span", {}, "Aciertos: "+se.score)),
    h("div", {class:"qcard"}, wordEl, reveal),
    opts,
    se.res === "ok" ? h("div", {class:"status ok"}, "¡Correcto! ", h("span", {class:"srsmsg"}, se.msg)) : null,
    se.res === "bad"
      ? h("div", {},
          h("div", {class:"status bad"}, (se.peeked ? "Revisaste la respuesta. " : "Incorrecto. "),
             h("span", {class:"srsmsg"}, se.msg)),
          h("button", {class:"btn", onclick:next}, se.queue.length > 1 || (se.mode==="review") ? "Siguiente →" : "Terminar"))
      : null
  );
}

/* ---------- Fin de mazo ---------- */
function deckEnd(){
  const se = S.sess, { V } = vref();
  const decks = Math.ceil(V.words.length / DECK_SIZE);
  const last = S.di === decks - 1;
  put(
    crumbs([V.id, "Mazo "+(S.di+1)+" terminado"]),
    h("div", {class:"result"},
      h("div", {class:"score"}, se.score+" / "+se.total),
      h("p", {class:"sub"}, se.score === se.total ? "Mazo perfecto. Las palabras entran al repaso SRS." : "Las falladas volverán en el repaso SRS en unos minutos."),
      last
        ? h("button", {class:"btn", onclick:()=>go({...S, view:"summary"})}, "Ver resumen del video")
        : h("button", {class:"btn", onclick:()=>startDeck(S.di+1)}, "Siguiente mazo →"),
      h("button", {class:"btn ghost", onclick:()=>startDeck(S.di)}, "Repetir mazo"),
      h("button", {class:"btn ghost", onclick:()=>go({view:"video", lang:S.lang, ci:S.ci, vi:S.vi})}, "Mazos")
    )
  );
}

/* ---------- Resumen del video ---------- */
function summary(){
  const { V } = vref();
  put(
    crumbs([V.id,"Resumen"], {view:"video", lang:S.lang, ci:S.ci, vi:S.vi}),
    h("h2", {}, "Resumen · "+V.id),
    h("p", {class:"sub"}, "Lee cada línea en japonés. Toca para ver la traducción."),
    V.lines.map(l => {
      const box = h("div", {class:"line", role:"button", tabindex:"0"},
        h("div", {class:"t"}, "["+l.t+"]"),
        h("div", {class:"jp", lang:"ja"}, l.jp));
      let open = false, tr = null;
      const toggle = () => {
        open = !open;
        if (open){ tr = h("div", {class:"tr"}, l.es); box.append(tr); } else tr.remove();
      };
      box.addEventListener("click", toggle);
      box.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); }});
      return box;
    }),
    h("button", {class:"btn", onclick:()=>go({view:"container", lang:S.lang, ci:S.ci})}, "Volver a los videos")
  );
}

/* ---------- Repaso SRS ---------- */
function srsHome(){
  const st = stats();
  const nextTxt = st.next === Infinity ? "—" : "en " + fmtIn(st.next - now());
  put(
    crumbs(["Hub","Repaso SRS"], {view:"hub"}),
    h("h2", {}, "Repaso SRS"),
    h("p", {class:"sub"}, "Palabras que ya estudiaste y toca repasar. Sesiones de hasta "+SESSION_MAX+"."),
    h("div", {class:"stats"},
      h("div", {class:"stat"}, h("b", {}, st.due), h("span", {}, "pendientes")),
      h("div", {class:"stat"}, h("b", {}, st.studied+"/"+st.total), h("span", {}, "estudiadas")),
      h("div", {class:"stat"}, h("b", {}, st.mature), h("span", {}, "dominadas (≥21 días)")),
      h("div", {class:"stat"}, h("b", {}, nextTxt), h("span", {}, "próxima pendiente"))),
    Object.entries(DATA).map(([lk, L]) => {
      const ls = stats(lk);
      if (!ls.total) return null;
      const due = dueCards(allCards(lk));
      return h("div", {class:"srsbar"},
        h("span", {}, h("b", {}, L.name), ": ", due.length ? due.length+" pendiente(s)" : "nada pendiente ("+ls.studied+" estudiadas)"),
        due.length ? h("button", {class:"btn small", onclick:()=>startReview(due.slice(0,SESSION_MAX), lk, {view:"srsHome"})}, "Repasar") : null);
    }),
    st.studied === 0 ? h("div", {class:"empty"}, "Aún no hay palabras en el SRS. Completa un mazo y aparecerán aquí.") : null,
    h("button", {class:"btn ghost danger", onclick: async () => {
      if (!confirm("¿Borrar todo tu progreso del SRS? No se puede deshacer.")) return;
      const { error } = await sb.from(TABLE).delete().eq("user_id", USER.id);
      if (error){ alert("No se pudo borrar: " + error.message); return; }
      SRS = {}; dirty = {}; saveSRS(); render();
    }}, "Reiniciar progreso")
  );
}
function reviewEnd(){
  const se = S.sess;
  const st = stats(S.lang);
  const nextTxt = st.next === Infinity ? null : "Próxima palabra pendiente en " + fmtIn(st.next - now()) + ".";
  put(
    crumbs(["Repaso terminado"]),
    h("div", {class:"result"},
      h("div", {class:"score"}, se.score+" / "+se.total),
      h("p", {class:"sub"}, "Acertadas a la primera. " + (st.due ? st.due+" más siguen pendientes." : (nextTxt || ""))),
      st.due ? h("button", {class:"btn", onclick:()=>startReview(dueCards(allCards(S.lang)).slice(0,SESSION_MAX), S.lang, se.back)}, "Seguir repasando") : null,
      h("button", {class:"btn ghost", onclick:()=>go(se.back)}, "Volver")
    )
  );
}

/* ---------- Arranque ---------- */
(async () => {
  go({view:"loading"});
  try {
    const { data } = await sb.auth.getSession();
    if (data.session){ USER = data.session.user; await enter(); }
    else go({view:"login"});
  } catch(e){ go({view:"login"}); }
  sb.auth.onAuthStateChange(ev => {
    if (ev === "SIGNED_OUT"){ USER = null; SRS = {}; dirty = {}; go({view:"login"}); }
  });
})();
</script>
